<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#13140f" />
    <link rel="icon" href="%sveltekit.assets%/favicon.svg" />
    <title>IaModelize3d</title>
    <!-- link previews (X, chats); the API rewrites these for shared projects and makes og:image absolute -->
    <meta name="description" content="From a description to a routed board, a printed case and firmware, built from LCSC parts and checked on a virtual board." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="IaModelize3d" />
    <meta property="og:title" content="IaModelize3d" />
    <meta property="og:description" content="From a description to a routed board, a printed case and firmware, built from LCSC parts and checked on a virtual board." />
    <meta property="og:image" content="/og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- apply the saved theme before first paint, so a light or recoloured theme does not flash dark -->
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('fw-theme');
          if (!raw) return;
          var t = JSON.parse(raw);
          if (!t || t.v !== 1 || typeof t.css !== 'string') return;
          if (t.mode !== 'dark' && t.mode !== 'light') return;
          var el = document.documentElement;
          el.style.cssText += t.css;
          el.dataset.theme = t.mode;
          var surface = /(?:^|;)--surface:([^;]+)/.exec(t.css);
          var meta = document.querySelector('meta[name="theme-color"]');
          if (surface && meta) meta.setAttribute('content', surface[1]);
        } catch (e) {}
      })();
    </script>
    <link
      rel="preload"
      as="style"
      href="%sveltekit.assets%/fonts/plex/plex.css"
      onload="
        this.onload = null;
        this.rel = 'stylesheet';
      "
    />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="%sveltekit.assets%/fonts/tabler-icons/fonts/tabler-icons.woff2?v=0d53824d" />
    <link
      rel="preload"
      as="style"
      href="%sveltekit.assets%/fonts/tabler-icons/tabler-icons.min.css?v=0d53824d"
      onload="
        this.onload = null;
        this.rel = 'stylesheet';
      "
    />
    <noscript>
      <link rel="stylesheet" href="%sveltekit.assets%/fonts/plex/plex.css" />
      <link rel="stylesheet" href="%sveltekit.assets%/fonts/tabler-icons/tabler-icons.min.css?v=0d53824d" />
    </noscript>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
